services:
  mysql:
    image: mysql:8.0
    container_name: hotel_mysql
    restart: always
    environment:
      MYSQL_DATABASE: hotel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: hotel_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hotel
      DB_USERNAME: hotel
      DB_PASSWORD: hotel123
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      - mysql

  frontend-user:
    build: ./frontend-user
    container_name: hotel_user
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

  frontend-admin:
    build: ./frontend-admin
    container_name: hotel_admin
    restart: always
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hotel_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
  backend_vendor: